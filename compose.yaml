services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8123/add', data=b'{\"a\":1,\"b\":2}', headers={'Content-Type':'application/json'}), timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
